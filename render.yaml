# Render blueprint: one free web service plus a free Postgres for the game world.
# render.com -> New -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: frogotraderz
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      # Test mode: new players get test $FROG and the TEST DEPOSIT button works.
      - key: DEV_MODE
        value: "true"
      # 1 = real time. Set 10 to make shifts and rests 10x faster while testing.
      - key: TIME_SCALE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: frogotraderz-db
          property: connectionString

databases:
  - name: frogotraderz-db
    plan: free
